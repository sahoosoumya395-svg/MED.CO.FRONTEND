<div class="leave-container">

    <!-- ===================== HEADER ===================== -->

    <h1 class="form-title">DOCTOR LEAVE APPLICATION FORM</h1>

    <!-- ===================== DOCTOR DETAILS ===================== -->

    <div class="section">

    <h2>Doctor Details</h2>

    <div class="row">

        <div class="form-group">
            <label>Doctor ID :</label>
            <input
                type="number"
                [(ngModel)]="doctorId"
                (blur)="loadDoctor()"
                placeholder="Enter Doctor ID">
        </div>

        <div class="form-group">
            <label>Doctor Name :</label>
            <input
                type="text"
                [(ngModel)]="doctorName"
                readonly>
        </div>

        <div class="form-group">
            <label>Department Name :</label>
            <input
                type="text"
                [(ngModel)]="departmentName"
                readonly>
        </div>

    </div>

</div>

    <!-- ===================== LEAVE DETAILS ===================== -->

    <div class="section">

        <h2>Leave Details</h2>

        <div class="row">

            <!-- To Date -->

            <div class="form-group">
                <label>To Date :</label>
              <input type="date" [(ngModel)]="leave.toDate" name="toDate">
            </div>

            <!-- From Date -->

            <div class="form-group">
                <label>From Date :</label>
               <input type="date" [(ngModel)]="leave.fromDate">
            </div>

            <!-- Leave Type -->

            <div class="form-group">
                <label>Leave Type :</label>

               <select [(ngModel)]="leave.leaveType" name="leaveType">

    <option value="" disabled>Select</option>

    <option value="CASUAL">Casual Leave</option>
    <option value="SICK">Sick Leave</option>
    <option value="EMERGENCY">Emergency Leave</option>
    <option value="MATERNITY">Maternity Leave</option>
   
</select>
            </div>

        </div>

    </div>

    <!-- ===================== REASON ===================== -->

    <div class="section">

        <h2>Reason Of Leave</h2>

        <div class="reason-box">

            <textarea
    rows="6"
    [(ngModel)]="leave.reason"
    name="reason">
</textarea>
        </div>

    </div>

    <!-- ===================== BUTTON ===================== -->

    <div class="button-area">

        <button type="button" (click)="submitLeave()">
    SUBMIT APPLICATION
</button>
    </div>

</div>
