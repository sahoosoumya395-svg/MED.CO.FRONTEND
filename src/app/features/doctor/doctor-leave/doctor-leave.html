<div class="leave-container">

    <!-- ===================== HEADER ===================== -->

    <h1 class="form-title">DOCTOR LEAVE APPLICATION FORM</h1>

    <!-- ===================== DOCTOR DETAILS ===================== -->

    <div class="section">

        <h2>Doctor Details</h2>

        <div class="row">

            <div class="form-group">
                <label>Doctor Name :</label>
                <input
                    type="text"
                    placeholder="Dr. x"
                    readonly
                />
            </div>

            <div class="form-group">
                <label>Department Name :</label>
                <input
                    type="text"
                    readonly
                />
            </div>

        </div>

    </div>

    <!-- ===================== LEAVE DETAILS ===================== -->

    <div class="section">

        <h2>Leave Details</h2>

        <div class="row">

            <!-- To Date -->

            <div class="form-group">
                <label>To Date :</label>
                <input type="date">
            </div>

            <!-- From Date -->

            <div class="form-group">
                <label>From Date :</label>
                <input type="date">
            </div>

            <!-- Leave Type -->

            <div class="form-group">
                <label>Leave Type :</label>

                <select>

                    <option value="" selected disabled>Select</option>

                    <option>Casual Leave</option>

                    <option>Sick Leave</option>

                    <option>Emergency Leave</option>

                    <option>Maternity Leave</option>

                    

                    <option>Other</option>

                </select>

            </div>

        </div>

    </div>

    <!-- ===================== REASON ===================== -->

    <div class="section">

        <h2>Reason Of Leave</h2>

        <div class="reason-box">

            <textarea
                rows="6"
                placeholder=""
            ></textarea>

        </div>

    </div>

    <!-- ===================== BUTTON ===================== -->

    <div class="button-area">

        <button type="submit">
            SUBMIT APPLICATION
        </button>

    </div>

</div>
