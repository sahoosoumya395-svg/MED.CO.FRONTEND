<div class="pre-register-wrapper">
  <!-- Top Header Branding -->
  <header class="page-header">
    <div class="brand-container" routerLink="/">
      <div class="brand-logo-box">
        <svg class="brand-icon" viewBox="0 0 40 40" fill="none">
          <path d="M20 4V36M4 20H36" stroke="#00b4d8" stroke-width="7" stroke-linecap="round" />
          <circle cx="20" cy="20" r="6" fill="#0077b6" />
        </svg>
      </div>
      <div class="brand-text">
        <h1 class="brand-name">HEALTH BRIDGE</h1>
        <p class="brand-tagline">WHERE CARE MEETS TECHNOLOGY</p>
      </div>
    </div>
  </header>

  <!-- Page Main Title -->
  <div class="title-section">
    <h2 class="main-title">Choose Your Registration</h2>
    <div class="title-underline"></div>
  </div>

  <!-- Registration Option Cards -->
  <div class="cards-grid">
    <!-- Doctor Registration Card -->
    <div class="role-card doctor-card">
      <div class="watermark-pattern doctor-pattern"></div>

      <div class="avatar-container">
        <img src="assets/images/doctor-profile.png" alt="Register as Doctor" class="avatar-image" />
      </div>

      <div class="card-info">
        <p class="card-subtitle">Register as</p>
        <h3 class="role-heading doctor-heading">Doctor</h3>
      </div>

      <div class="card-actions">
        <a routerLink="/doctor/add" class="continue-btn doctor-btn">
          <span>Sign Up</span>
          <svg
            class="btn-arrow"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <path d="M5 12h14M12 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </a>

        <div class="signin-subtext">
          Already have an account?
          <a
            [routerLink]="['/login']"
            [queryParams]="{ role: 'doctor' }"
            class="signin-link doctor-link"
            >Sign In</a
          >
        </div>
      </div>
    </div>

    <!-- Patient Registration Card -->
    <div class="role-card patient-card">
      <div class="watermark-pattern patient-pattern"></div>

      <div class="avatar-container">
        <img
          src="assets/images/patient-profile.png"
          alt="Register as Patient"
          class="avatar-image"
        />
      </div>

      <div class="card-info">
        <p class="card-subtitle">Register as</p>
        <h3 class="role-heading patient-heading">Patient</h3>
      </div>

      <div class="card-actions">
        <a routerLink="/patient/register" class="continue-btn patient-btn">
          <span>Sign Up</span>
          <svg
            class="btn-arrow"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <path d="M5 12h14M12 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </a>

        <div class="signin-subtext">
          Already have an account?
          <a
            [routerLink]="['/login']"
            [queryParams]="{ role: 'patient' }"
            class="signin-link patient-link"
            >Sign In</a
          >
        </div>
      </div>
    </div>
  </div>
</div>
