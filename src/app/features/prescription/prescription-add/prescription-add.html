<div class="prescription-container">

    <!-- ================= HEADER ================= -->

    <header class="prescription-header">

        <div class="doctor-section">

            <div class="doctor-logo">
                <img src="assets/images/logo.webp" alt="Doctor Logo">
            </div>

            <div class="doctor-details">

                <h1>{{ doctorName }}</h1>

                <h3>{{ specialization }}</h3>

                <h2>{{ hospitalName }}</h2>

                <p>{{ hospitalAddress }}</p>

            </div>

        </div>

        <div class="hospital-section">

            <h1>MED.Co</h1>

            <img src="assets/images/HEALTH BRIDGE2.png" alt="MED.CO Logo">

        </div>

    </header>

    <div class="header-line"></div>

    <!-- ================= PATIENT DETAILS ================= -->

    <section class="patient-details">

        <div class="patient-row">

            <div class="patient-field patient-name">

                <label>Patient Name :</label>

                <span>{{ patientName }}</span>

            </div>

            <div class="patient-field patient-age">

                <label>Age :</label>

                <span>{{ age }}</span>

            </div>

        </div>

        <div class="patient-row">

            <div class="patient-field patient-date">

                <label>Date :</label>

                <span>{{ date }}</span>

            </div>

            <div class="patient-field patient-mrn">

                <label>MRN No :</label>

                <span>{{ mrnNo }}</span>

            </div>

        </div>

        <div class="patient-row">

            <div class="patient-field patient-address">

                <label>Address :</label>

                <span>{{ address }}</span>

            </div>

        </div>

    </section>

    <div class="header-line"></div>

    <!-- ================= PRESCRIPTION BODY ================= -->

    <section class="prescription-body">

        <div class="rx-symbol">
            <span>Rx</span>
        </div>

        <div class="medicine-content">

            <!-- Diagnosis -->

            <div class="diagnosis-section">

                <h3>Diagnosis</h3>

                <textarea
                    [(ngModel)]="diagnosis"
                    rows="4"
                    placeholder="Enter diagnosis">
                </textarea>

            </div>

            <!-- Medicines -->

            <div class="medicine-section">

                <h3>Medicines</h3>

                <textarea
                    [(ngModel)]="medicines"
                    rows="8"
                    placeholder="Enter medicines">
                </textarea>

            </div>

            <!-- Advice -->

            <div class="advice-section">

                <h3>Advice</h3>

                <textarea
                    [(ngModel)]="advice"
                    rows="6"
                    placeholder="Enter advice">
                </textarea>

            </div>

        </div>

    </section>

    <!-- SAVE BUTTON -->

    <div class="button-section">

        <button
            class="save-btn"
            (click)="savePrescription()">

            Save Prescription

        </button>


    <button
        class="print-btn"
        (click)="printPrescription()"
        [disabled]="!prescriptionHtml">

        Print Prescription

    </button>


    </div>

    <!-- ================= FOOTER ================= -->

    <footer class="prescription-footer">

        <div class="doctor-signature">

            <img src="assets/images/signature.png" alt="Doctor Signature">

            <div class="signature-line"></div>

            <h3>Signature</h3>

        </div>

    </footer>

</div>
