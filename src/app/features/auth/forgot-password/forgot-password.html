


<div class="page">

  <!-- Navbar -->
  <header class="navbar">

    <div class="logo" routerLink="/" style="cursor: pointer;">
      <img src="assets/logo/logo.png" alt="Logo">
      <div>
        <h2 class="logo-text">HEALTH BRIDGE</h2>
        <p class="logo-subtext">WHERE CARE MEETS TECHNOLOGY</p>
      </div>
    </div>

    <div class="nav-right">
    <nav class="nav-links">
     <a routerLink="/">Home</a>
     <a routerLink="/about-us">About Us</a>
     <a routerLink="/services">Services</a>
     <a routerLink="/contact-us">Contact Us</a>
      <a routerLink="/language">Languages</a>
   </nav>
    <a routerLink="/login" class="login-btn-nav">Login</a>
  </div>

  </header>


  <!-- Card -->

  <div class="card">

      <div class="title">
          <span>ⓘ</span>
          <h2 class="title-text">Password Recovery</h2>
      </div>

      <label>Email <span>*</span></label>

      <input
      type="text"
      placeholder=""
      [(ngModel)]="email">

      <label>OTP</label>

      <div class="otp-box">

          <input maxlength="1">
          <input maxlength="1">
          <input maxlength="1">
          <input maxlength="1">
          <input maxlength="1">
          <input maxlength="1">

      </div>

      <button class="otp-btn" (click)="getOtp()">
          GET OTP
      </button>

      <p>
          Didn't Receive The code?
          <a (click)="resendOtp()">Resend OTP</a>
      </p>

  </div>

  <!-- Footer -->

  <footer>

      © NIC, 2015 | All Rights Reserved® |
      Govt. Of India

      <br>

      Build Version : 2025.8.601 Updated on July 31, 2029, Thursday

  </footer>

</div>
