

<!-- NAVBAR -->
<header class="navbar">
  <div class="logo" routerLink="/" style="cursor: pointer;">
    <img
      src="assets/logo/logo.png"
      alt="MED.CO Logo"
      class="logo-icon">

    <div class="logo-text">
      <span class="logo-title">HEALTH BRIDGE</span>
      <span class="logo-sub">WHERE CARE MEETS TECHNOLOGY</span>
    </div>
  </div>

  <div class="nav-right">
    <nav class="nav-links">
      <a routerLink="/">Home</a>
      <a routerLink="/about-us">About Us</a>
      <a routerLink="/services">Services</a>
      <a routerLink="/contact-us">Contact Us</a>
      <a routerLink="/language">Languages</a>
    </nav>

    <a routerLink="/login" class="login-btn-nav">Login</a>
  </div>
</header>

<!-- MAIN CONTENT -->
<main class="main-content">

  <!-- LEFT ILLUSTRATION -->
  <section class="illustration">
    <img 
      src="assets/images/login_img.png"
      alt="Healthcare Illustration">
  </section>

  <!-- LOGIN CARD -->
  <section class="login-card">
    <div class="card-logo">
      <img src="assets/logo/logo.png"
           alt="MED.CO Logo"
           class="card-logo-img">

      <span class="card-logo-title">HEALTH BRIDGE</span>
      <span class="card-logo-sub">
          Where Care Meets Technology
      </span>
    </div>

    <h2 class="card-heading">Lets start with
      <br> us</h2>

    <form class="login-form" (submit)="$event.preventDefault()">        
      <label class="input-wrap">
        <input type="text" placeholder="Email" required>
        <span class="icon">&#128100;</span>
      </label>

      <label class="input-wrap">
        <input type="password" placeholder="Password" required>
        <span class="icon">&#128274;</span>
      </label>

      <div class="captcha-row">
        <span class="captcha-label">Anti-bot Validation</span>
        <div class="captcha-inputs">
          <input type="text" class="captcha-field" placeholder="Captcha">
          <div class="captcha-image">
            <span class="captcha-text">CAPTCHA</span>
            <button type="button" class="refresh-btn" title="Refresh captcha">&#8635;</button>
          </div>
        </div>
      </div>

      <button type="button" class="sign-in-btn" (click)="login()">
          SIGN IN
      </button>

      <div class="signup-row">
        <span>NEW TO MED.CO ?</span>
        <button
          type="button"
          class="sign-up-btn"
          (click)="goToRegister()">
          SIGN UP
        </button>
      </div>

      <a routerLink="/forgot-password" (click)="forgotPassword($event)" class="forgot-link" style="cursor: pointer;">
        Forgot Password?</a>
    </form>
  </section>

</main>
